name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, testy a build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formát
        run: npm run format:check

      - name: Kontrola typů
        run: npm run typecheck

      - name: Testy
        run: npm test

      - name: Build
        run: npm run build

  installer:
    name: Instalátor
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      # mpv a ffmpeg se stahují s pevnou verzí a kontrolou SHA-256 (skripty fetch-*.mjs).
      - name: Cache mpv a ffmpeg
        uses: actions/cache@v6
        with:
          path: resources/bin
          key: bin-${{ hashFiles('scripts/fetch-mpv.mjs', 'scripts/fetch-ffmpeg.mjs') }}

      - name: Sestavení instalátoru
        run: npm run dist
      # Instalátor se jen sestaví (kontrola, že build funguje); nenahrává se jako artefakt,
      # protože 195 MB rychle zaplní bezplatnou kvótu úložiště. Vydání dělá workflow release.yml.

name: Vydání

# Tag v1.2.3 → instalátor a latest.yml jako KONCEPT vydání v Miroslave11/kinoteka-vydani.
# Aplikace si aktualizaci stáhne až po ručním zveřejnění konceptu.
on:
  push:
    tags: ['v*']

jobs:
  release:
    name: Instalátor do kinoteka-vydani
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Testy
        run: npm test

      # Vydání jsou v soukromém repozitáři – verze bez klíče pro čtení by se už nikdy
      # neaktualizovala, proto bez něj vydání nevznikne.
      - name: Klíč pro aktualizace je nastavený
        shell: bash
        env:
          KINOTEKA_UPDATE_TOKEN: ${{ secrets.KINOTEKA_UPDATE_TOKEN }}
        run: test -n "$KINOTEKA_UPDATE_TOKEN" || { echo "Chybí secret KINOTEKA_UPDATE_TOKEN"; exit 1; }

      - name: Verze v package.json odpovídá tagu
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Cache mpv a ffmpeg
        uses: actions/cache@v6
        with:
          path: resources/bin
          key: bin-${{ hashFiles('scripts/fetch-mpv.mjs', 'scripts/fetch-ffmpeg.mjs') }}

      # Koncept založit předem: electron-builder nahrává instalátor a latest.yml souběžně
      # a bez existujícího konceptu si každé nahrávání založí vlastní (stalo se u 1.1.0).
      - name: Koncept vydání v kinoteka-vydani
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KINOTEKA_VYDANI_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo Miroslave11/kinoteka-vydani >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo Miroslave11/kinoteka-vydani --draft               --title "Kinotéka ${GITHUB_REF_NAME#v}"               --notes "$(awk -v v="## ${GITHUB_REF_NAME#v}" 'index($0, v) == 1 {f = 1; next} /^## / {if (f) exit} f' CHANGELOG.md)"

      - name: Sestavení a nahrání konceptu vydání
        env:
          # Klíč s právem zápisu jen do repozitáře kinoteka-vydani (Settings → Secrets → Actions).
          GH_TOKEN: ${{ secrets.KINOTEKA_VYDANI_TOKEN }}
          # Klíč jen pro čtení kinoteka-vydani – vloží se do aplikace (aktualizace ze soukromého repa).
          KINOTEKA_UPDATE_TOKEN: ${{ secrets.KINOTEKA_UPDATE_TOKEN }}
          # Klíč aplikace u Googlu pro sdílení přes Google Disk (bez něj se sdílení nedá zapnout).
          KINOTEKA_GOOGLE_CLIENT_ID: ${{ secrets.KINOTEKA_GOOGLE_CLIENT_ID }}
          KINOTEKA_GOOGLE_CLIENT_SECRET: ${{ secrets.KINOTEKA_GOOGLE_CLIENT_SECRET }}
          # Electron a nástroje electron-builderu přes místní zrcadlo (scripts/eb-mirror.mjs).
          EB_MIRROR_TOKEN: ${{ github.token }}
        run: npm run fetch:bin && npm run build && node scripts/eb-mirror.mjs npx electron-builder --win --publish always

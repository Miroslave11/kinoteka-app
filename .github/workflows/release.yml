name: Vydání

# Tag v1.2.3 → instalátor a latest.yml jako KONCEPT vydání ve veřejném Miroslave11/kinoteka-app.
# Aplikace si aktualizaci stáhne až po ručním zveřejnění konceptu.
on:
  push:
    tags: ['v*']

# Vestavěný GITHUB_TOKEN smí zakládat vydání v tomto repozitáři.
permissions:
  contents: write

jobs:
  release:
    name: Instalátor do vydání
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Testy
        run: npm test

      # Sdílení přes Google Disk: klíč aplikace u Googlu (Google Cloud → Clients, typ Desktop app).
      - name: Klíč Google pro sdílení je platný
        shell: bash
        env:
          KINOTEKA_GOOGLE_CLIENT_ID: ${{ secrets.KINOTEKA_GOOGLE_CLIENT_ID }}
          KINOTEKA_GOOGLE_CLIENT_SECRET: ${{ secrets.KINOTEKA_GOOGLE_CLIENT_SECRET }}
        run: |
          [[ "$KINOTEKA_GOOGLE_CLIENT_ID" =~ ^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$ ]] ||
            { echo "Secret KINOTEKA_GOOGLE_CLIENT_ID není ID klienta Google (…apps.googleusercontent.com)"; exit 1; }
          [[ "$KINOTEKA_GOOGLE_CLIENT_SECRET" == GOCSPX-* ]] ||
            { echo "Secret KINOTEKA_GOOGLE_CLIENT_SECRET není tajný klíč klienta Google (GOCSPX-…)"; exit 1; }

      - name: Verze v package.json odpovídá tagu
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Cache mpv a ffmpeg
        uses: actions/cache@v6
        with:
          path: resources/bin
          key: bin-${{ hashFiles('scripts/fetch-mpv.mjs', 'scripts/fetch-ffmpeg.mjs') }}

      # Koncept založit předem: electron-builder nahrává instalátor a latest.yml souběžně
      # a bez existujícího konceptu si každé nahrávání založí vlastní (stalo se u 1.1.0).
      - name: Koncept vydání
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" 'index($0, v) == 1 {f = 1; next} /^## / {if (f) exit} f' CHANGELOG.md > notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag               --title "Kinotéka ${GITHUB_REF_NAME#v}" --notes-file notes.md

      - name: Sestavení a nahrání konceptu vydání
        env:
          GH_TOKEN: ${{ github.token }}
          # Klíč aplikace u Googlu pro sdílení přes Google Disk (bez něj se sdílení nedá zapnout).
          KINOTEKA_GOOGLE_CLIENT_ID: ${{ secrets.KINOTEKA_GOOGLE_CLIENT_ID }}
          KINOTEKA_GOOGLE_CLIENT_SECRET: ${{ secrets.KINOTEKA_GOOGLE_CLIENT_SECRET }}
          # Electron a nástroje electron-builderu přes místní zrcadlo (scripts/eb-mirror.mjs).
          EB_MIRROR_TOKEN: ${{ github.token }}
        run: npm run fetch:bin && npm run build && node scripts/eb-mirror.mjs npx electron-builder --win --publish always
